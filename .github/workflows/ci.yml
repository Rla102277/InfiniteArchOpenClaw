name: HQ CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Shell syntax
        shell: bash
        run: |
          for script in bootstrap.sh setup.sh hq scripts/*.sh; do
            bash -n "$script"
          done
      - name: Static skill and document gates
        run: python3 scripts/verify.py
      - name: Canonical brain validation
        run: python3 -m aihq.cli validate
      - name: Compile Python
        run: python3 -m compileall -q aihq
      - name: Browser script syntax
        run: node --check web/app.js
      - name: Standard-library unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Basic secret file check
        shell: bash
        run: |
          test ! -f .env
          test ! -f .hermes/config.yaml
