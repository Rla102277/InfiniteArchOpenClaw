<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05080C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agentic OS">
  <title>THE INFINITE ARCH · WHOPR</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/command.css">
  <script defer src="/command.js"></script>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div id="tl">
    <a class="brand" href="/"><b>THE INFINITE ARCH</b><span>WHOPR · Command Center</span></a>
    <div id="feed" role="log" aria-label="Activity feed"></div>
  </div>

  <div id="tiles" role="list"></div>

  <div id="detail" hidden>
    <button id="detail-back" type="button">Back</button>
    <h2 id="detail-title"></h2>
    <div id="detail-kpis"></div>
    <div id="detail-rows"></div>
  </div>

  <div id="bl">
    <span id="data-chip" class="chip">live</span>
    <button id="mic" class="btn" type="button" hidden>MIC</button>
    <button id="vout" class="btn" type="button">Voice out: off</button>
    <a class="btn ghost" href="/">Dashboard</a>
  </div>

  <div id="talk">
    <div id="hist"></div>
    <div id="whopr" title="Tap to type" tabindex="0">Everything you run lives inside me. Start typing, tap the mic, or pick a domain.</div>
    <input id="inp" placeholder='Type, e.g. "approvals" or a question' autocomplete="off" hidden>
  </div>
</body>
</html>
