<!doctype html>
<html lang="en" data-theme="hud">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arch HQ">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/themes/themes.css">
<link rel="stylesheet" href="/command.css">
<title>Infinite Arch HQ</title>
</head>
<body>
<a class="skip" href="#talk">Skip to command</a>
<div class="app">
  <header class="topbar">
    <h1 class="brand"><strong>INFINITE ARCH</strong><span>Headquarters</span></h1>
    <div id="feed" aria-live="polite" aria-label="Activity"></div>
    <div class="top-actions">
      <span id="modeChip" class="chip">Live local data</span>
      <span id="stateChip" class="chip" role="status">Idle</span>
      <time id="clock" datetime=""></time>
      <label>Theme <select id="theme" aria-label="Theme"></select></label>
      <label>Workspace <select id="workspace" aria-label="Workspace"></select></label>
      <a class="text-link" href="/">Classic dashboard</a>
    </div>
    <p id="banner" class="banner" role="status" hidden></p>
  </header>
  <div id="stage">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div id="orbit" aria-hidden="true"></div>
    <div id="tiles">
      <div class="col" id="colL"></div>
      <div class="col" id="colR"></div>
    </div>
  </div>
  <div class="bottom">
    <nav id="dock" aria-label="Domains"></nav>
    <section id="talk" aria-label="Command">
      <div id="hist" aria-live="polite"></div>
      <p id="prompt">This headquarters is a window onto this machine. GitHub keeps the system definition. Pick a domain or type a command.</p>
      <form id="composer">
        <label class="sr" for="inp">Command</label>
        <input id="inp" autocomplete="off" placeholder="Type a command, for example agents">
        <label class="sr" for="provider">Provider</label>
        <select id="provider" aria-label="Provider"></select>
        <button type="submit">Send</button>
      </form>
      <div class="ctl">
        <button type="button" id="mic" aria-pressed="false">Microphone off</button>
        <button type="button" id="vout" aria-pressed="false">Voice out off</button>
        <button type="button" id="demo" aria-pressed="false">Demo mode off</button>
        <button type="button" id="new-action">New</button>
      </div>
      <p id="voiceNote" class="notice"></p>
    </section>
  </div>
  <p id="notice" role="status" aria-live="polite"></p>
</div>
<dialog id="editor">
  <form id="editor-form">
    <h2 id="editor-title">New local record</h2>
    <p id="editor-help"></p>
    <div id="editor-fields"></div>
    <div class="buttons">
      <button type="button" id="editor-cancel" class="btn">Cancel</button>
      <button type="submit" class="btn go">Save</button>
    </div>
  </form>
</dialog>
<script src="/command.js" defer></script>
</body>
</html>
